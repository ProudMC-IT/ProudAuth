name: ProudAuth
version: '${version}'
main: com.monkey.proudAuth.ProudAuth
api-version: '1.21'
load: STARTUP
authors: [Monkey]
description: Plugin di autenticazione premium/cracked per Paper 1.21.1
libraries:
  - com.zaxxer:HikariCP:7.0.2
  - org.mindrot:jbcrypt:0.4
  - dev.samstevens.totp:totp:1.7.1
  - com.mysql:mysql-connector-j:9.6.0

commands:
  login:
    description: Accedi con la tua password
    usage: /login <password>
    permission: proudauth.login
  register:
    description: Registra un account
    usage: /register <password> <conferma>
    permission: proudauth.register
  sp:
    description: Imposta il primo claim cracked/sp per questo nickname
    usage: /sp
    permission: proudauth.sp
    aliases: [cracked]
  premium:
    description: Avvia il claim premium del nickname corrente
    usage: /premium
    permission: proudauth.premium
  changepassword:
    description: Cambia la tua password
    usage: /changepassword <vecchia> <nuova> <conferma>
    permission: proudauth.changepassword
  logout:
    description: Disconnetti la sessione
    usage: /logout
    permission: proudauth.logout
  2fa:
    description: Gestione autenticazione a due fattori
    usage: /2fa <init|setup|disable|flow|status|codice>
    permission: proudauth.2fa
  proudauth:
    description: Comandi amministrativi ProudAuth
    usage: /proudauth <forcelogin|forcelogout|resetpassword|banip|unbanip|trustip|whitelistip|stats|reload>
    permission: proudauth.admin
    aliases: [proudauthbackend]

permissions:
  proudauth.login:
    default: true
  proudauth.register:
    default: true
  proudauth.sp:
    default: true
  proudauth.premium:
    default: true
  proudauth.changepassword:
    default: true
  proudauth.logout:
    default: true
  proudauth.2fa:
    default: true
  proudauth.admin:
    default: op
  proudauth.admin.forcelogin:
    default: op
  proudauth.admin.forcelogout:
    default: op
  proudauth.admin.resetpassword:
    default: op
  proudauth.admin.banip:
    default: op
  proudauth.admin.unbanip:
    default: op
  proudauth.admin.trustip:
    default: op
  proudauth.admin.whitelistip:
    description: Gestisce la whitelist IP premium
    default: op
  proudauth.admin.stats:
    default: op
  proudauth.admin.reload:
    default: op
  proudauth.admin.update:
    default: op
  proudauth.bypass.auth:
    description: Bypassa autenticazione
    default: false
