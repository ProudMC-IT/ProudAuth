name: ProudAuth
version: '${version}'
main: com.monkey.proudAuth.ProudAuth
api-version: '1.21'
folia-supported: true
load: STARTUP
authors: [MonkeyMoon104]
description: Plugin di autenticazione premium/cracked per Paper 1.21.1
libraries:
  - com.zaxxer:HikariCP:7.0.2
  - org.mindrot:jbcrypt:0.4
  - dev.samstevens.totp:totp:1.7.1
  - com.mysql:mysql-connector-j:9.6.0

commands:
  login:
    description: Accedi con la tua password
    usage: /login <password>
    permission: proudauth.login
  register:
    description: Registra un account
    usage: /register <password> <conferma>
    permission: proudauth.register
  sp:
    description: Imposta il primo claim cracked/sp per questo nickname
    usage: /sp
    permission: proudauth.sp
    aliases: [cracked]
  premium:
    description: Avvia il claim premium del nickname corrente
    usage: /premium
    permission: proudauth.premium
  changepassword:
    description: Cambia la tua password
    usage: /changepassword <vecchia> <nuova> <conferma>
    permission: proudauth.changepassword
  logout:
    description: Disconnetti la sessione
    usage: /logout
    permission: proudauth.logout
  2fa:
    description: Gestione autenticazione a due fattori
    usage: /2fa <init|setup|disable|flow|status|codice>
    permission: proudauth.2fa
  proudauth:
    description: Comandi amministrativi ProudAuth
    usage: /proudauth <forcelogin|forcelogout|resetpassword|wipeplayer|banip|unbanip|trustip|whitelistip|claim|session|premiumcheck|authinfo|2fa|unlock|history|bridge|debug|stats|reload>
    permission: proudauth.admin
    aliases: [proudauthbackend]

permissions:
  proudauth.login:
    default: true
  proudauth.register:
    default: true
  proudauth.sp:
    default: true
  proudauth.premium:
    default: true
  proudauth.changepassword:
    default: true
  proudauth.logout:
    default: true
  proudauth.2fa:
    default: true
  proudauth.admin:
    default: op
  proudauth.admin.forcelogin:
    default: op
  proudauth.admin.forcelogout:
    default: op
  proudauth.admin.resetpassword:
    default: op
  proudauth.admin.wipeplayer:
    description: Rimuove completamente account e stato auth di un player
    default: op
  proudauth.admin.banip:
    default: op
  proudauth.admin.unbanip:
    default: op
  proudauth.admin.trustip:
    default: op
  proudauth.admin.whitelistip:
    description: Gestisce la whitelist IP premium
    default: op
  proudauth.admin.claim:
    description: Gestisce i claim locali premium/cracked
    default: op
  proudauth.admin.session:
    description: Gestisce e ispeziona le sessioni
    default: op
  proudauth.admin.premiumcheck:
    description: Esegue controlli premium Mojang
    default: op
  proudauth.admin.authinfo:
    description: Mostra lo stato auth completo di un player
    default: op
  proudauth.admin.2fa:
    description: Gestisce la 2FA degli account
    default: op
  proudauth.admin.unlock:
    description: Sblocca lockout e pending state
    default: op
  proudauth.admin.history:
    description: Consulta la history IP/account type
    default: op
  proudauth.admin.bridge:
    description: Ispeziona lo stato del bridge proxy/backend
    default: op
  proudauth.admin.debug:
    description: Strumenti debug runtime ProudAuth
    default: op
  proudauth.admin.stats:
    default: op
  proudauth.admin.reload:
    default: op
  proudauth.admin.update:
    default: op
  proudauth.bypass.auth:
    description: Bypassa autenticazione
    default: false
