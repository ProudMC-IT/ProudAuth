# ProudAuth Bukkit bootstrap
#
# This file is local to each backend and is intentionally minimal.
# The real ProudAuth network configuration is loaded from the shared DB
# and is published by the Velocity proxy from velocity-config.yml.
#
# On Bukkit you only keep:
# - database access to reach the shared ProudAuth state
# - the logical server-id for this backend
# - the local region-id for this backend when using optional region-aware routing
# - local sync/update behavior
#
# How to fill this file:
#
# Legacy single-proxy setup:
#   network.server-id: "auth"
#   network.region-id: ""
#
# Region-aware setup examples:
#   backend auth EU:
#     network.server-id: "auth-eu"
#     network.region-id: "eu"
#
#   backend lobby EU:
#     network.server-id: "lobby-eu"
#     network.region-id: "eu"
#
#   backend auth NA:
#     network.server-id: "auth-na"
#     network.region-id: "na"
#
# Important:
# - server-id must match the exact Velocity registered server name
# - region-id must match the proxy-local.region-id used by the proxy that routes to this backend
# - if you run two regions, each backend should declare the region it belongs to

database:
  host: "localhost"
  port: 3306
  name: "proudauth"
  user: "root"
  password: "password"
  pool-size: 10

network:
  # Exact backend id used by ProudAuth for this server.
  # In a Velocity network this should match the registered Velocity server name.
  #
  # Examples:
  # - "auth"
  # - "auth-eu"
  # - "lobby-na"
  server-id: ""

  # Optional local region id for this backend instance.
  # Leave empty to use legacy single-region behavior.
  # Set it to the same value used by the proxy-local.region-id that routes here.
  #
  # Examples:
  # - ""
  # - "eu"
  # - "na"
  region-id: ""

config-sync:
  # How often this backend checks the DB for a new shared config version.
  poll-interval-seconds: 2

updates:
  # Local update-check behavior for this backend jar.
  check-enabled: true

  # If true, admins on this backend are notified in game when they join.
  notify-admin-on-join: true
