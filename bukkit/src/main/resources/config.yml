# ProudAuth Bukkit bootstrap
#
# This file is local to each backend and is intentionally minimal.
# The real ProudAuth network configuration is loaded from the shared DB
# and is published by the Velocity proxy from velocity-config.yml.
#
# On Bukkit you only keep:
# - database access to reach the shared ProudAuth state
# - the logical server-id for this backend
# - local sync/update behavior

database:
  host: "localhost"
  port: 3306
  name: "proudauth"
  user: "root"
  password: "password"
  pool-size: 10

network:
  # Exact backend id used by ProudAuth for this server.
  # In a Velocity network this should match the registered Velocity server name.
  server-id: ""

config-sync:
  # How often this backend checks the DB for a new shared config version.
  poll-interval-seconds: 2

updates:
  # Local update-check behavior for this backend jar.
  check-enabled: true

  # If true, admins on this backend are notified in game when they join.
  notify-admin-on-join: true
