plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.1'
}

def resourceProperties = [version: project.version.toString()]

dependencies {
    implementation 'org.bstats:bstats-bukkit:3.2.1'

    compileOnly 'org.jetbrains:annotations:26.0.2'

    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
    compileOnly 'com.velocitypowered:velocity-api:3.5.0-SNAPSHOT'
    annotationProcessor 'com.velocitypowered:velocity-api:3.5.0-SNAPSHOT'

    compileOnly 'com.zaxxer:HikariCP:7.0.2'
    compileOnly 'org.mindrot:jbcrypt:0.4'
    compileOnly 'dev.samstevens.totp:totp:1.7.1'
    compileOnly 'com.mysql:mysql-connector-j:9.6.0'
    compileOnly 'org.yaml:snakeyaml:2.6'
}

sourceSets {
    main {
        java {
            srcDirs = [
                    '../common/src/main/java',
                    '../bootstrap/src/main/java',
                    '../bukkit/src/main/java',
                    '../velocity/src/main/java'
            ]
        }
        resources {
            srcDirs = [
                    '../common/src/main/resources',
                    '../bukkit/src/main/resources',
                    '../velocity/src/main/resources'
            ]
        }
    }
    test {
        java.srcDirs = []
        resources.srcDirs = []
    }
}

tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.properties(resourceProperties)
    filesMatching('plugin.yml') {
        expand(resourceProperties)
    }
}

tasks.jar {
    enabled = false
}

tasks.shadowJar {
    archiveFileName.set('ProudAuth.jar')
    configurations = [project.configurations.runtimeClasspath]

    dependencies {
        exclude { it.moduleGroup != 'org.bstats' }
    }

    relocate 'org.bstats', "${project.group}.libs.bstats"
}

tasks.assemble {
    dependsOn tasks.shadowJar
}
