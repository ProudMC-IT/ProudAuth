prefix: "<dark_gray>[<aqua>ProudAuth</aqua>]</dark_gray> "

not-authenticated: "<red>You must authenticate first. Use /login <password> or /register <password> <confirm>."
already-authenticated: "<yellow>You are already authenticated."
login-success: "<green>Login successful. Welcome, <white><player></white>!"
login-wrong-password: "<red>Wrong password."
register-success: "<green>Registration completed. Use /login <password> to sign in."
register-already-exists: "<red>This account is already registered."
register-password-mismatch: "<red>The passwords do not match."
register-password-too-short: "<red>The password must be at least <min> characters long."
register-password-too-long: "<red>The password cannot exceed <max> characters."
register-password-invalid: "<red>The password does not satisfy the complexity requirements."
register-required-first: "<red>This account is not registered yet. Use /register <password> <confirm>."
logout-success: "<green>You have been logged out from the current session."
change-password-success: "<green>Password changed successfully."
change-password-wrong-old: "<red>The old password is incorrect."
session-restored: "<green>Your session has been restored automatically. Welcome back, <white><player></white>!"
premium-auto-login: "<green>Premium account verified. Automatic login completed."

kick-auth-timeout: "<red>Authentication timeout expired. Authenticate faster on your next login."
kick-ip-banned: "<red>Your IP has been temporarily blocked because of too many failed attempts."
kick-bridge-required: "<red>Access denied: the trusted proxy assertion is invalid or expired."
kick-backend-unavailable: "<red>Connection temporarily blocked: backend is not ready yet. Please retry in a few seconds."
move-blocked: "<red>You must authenticate before moving!"
chat-blocked: "<red>You must authenticate before using the chat!"
interact-blocked: "<red>You must authenticate before interacting!"
command-blocked: "<red>You can only use /login, /register and /2fa until you authenticate."

bruteforce-warning: "<yellow>Warning: <attempts> failed attempts. You will be blocked after <max>."
bruteforce-locked: "<red>Too many failed attempts. Try again in <seconds> seconds."

totp-required: "<yellow>Enter your 2FA code with /2fa <code>."
totp-invalid: "<red>Invalid 2FA code."
totp-setup: "<green>2FA enabled. URI: <uri> <gray>Key:</gray> <white><key></white>"
totp-disabled: "<green>2FA disabled."
totp-already-enabled: "<yellow>2FA is already enabled."
totp-disabled-config: "<red>2FA is disabled in the configuration."
totp-not-enabled: "<red>2FA is not enabled for this account."
totp-not-required: "<yellow>No 2FA verification is currently pending."

admin-force-login: "<green>Forced login applied to <player>."
admin-force-logout: "<green>Forced logout applied to <player>."
admin-reset-password: "<green>Password reset for <player>."
admin-ip-banned: "<green>Blocked IP <ip>."
admin-ip-unbanned: "<green>Unblocked IP <ip>."
admin-player-not-found: "<red>Player <player> was not found in the database."
admin-reload: "<green>Configuration reloaded."
admin-unknown-subcommand: "<red>Unknown subcommand."

stats-header: "<aqua>--- ProudAuth Stats ---"
stats-registered: "<gray>Registered accounts: <white><count>"
stats-online: "<gray>Authenticated now: <white><count>"
stats-premium: "<gray>Premium accounts: <white><count>"
stats-sessions-active: "<gray>Active sessions: <white><count>"

error-generic: "<red>Internal error. Contact an administrator."
error-usage: "<red>Usage: <usage>"
no-permission: "<red>You do not have permission to run this command."
player-only: "<red>This command can only be executed by a player."
