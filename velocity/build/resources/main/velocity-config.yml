# =============================================
# ProudAuth - Proxy Velocity
# Questo file contiene solo chiavi realmente usate
# dal companion proxy.
#
# Il proxy usa solo:
# - database: per leggere i ban IP condivisi
# - premium: per risolvere il profilo premium
# - bridge: per firmare e salvare assertion trusted
# =============================================

debugger:
  enabled: false
  player-resolution: true
  session-flow: true
  premium-flow: true
  bridge-flow: true
  security-flow: false
  protection-flow: true
  ip-ban-flow: true
  profile-flow: true
  movement-audit: false
  teleport-audit: false
  command-flow: true

database:
  host: "localhost"
  port: 3306
  name: "proudauth"
  user: "root"
  password: "password"
  pool-size: 10

premium:
  enabled: true
  api-timeout-ms: 3000
  # Se true, ProudAuth riscrive il GameProfile sul proxy con l'UUID premium.
  # Su alcune reti offline-mode questo può creare comportamenti anomali lato backend.
  # Default sicuro: false. Il backend riceve comunque l'esito premium via bridge.
  rewrite-game-profile: false

bridge:
  enabled: false
  mode: FALLBACK
  transport: MYSQL
  shared-secret: "change-me"
  assertion-ttl-seconds: 10
