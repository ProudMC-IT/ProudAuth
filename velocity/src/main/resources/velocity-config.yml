language: "it"

database:
  host: "localhost"
  port: 3306
  name: "proudauth"
  user: "root"
  password: "password"
  pool-size: 10

debugger:
  enabled: false
  player-resolution: true
  session-flow: true
  premium-flow: true
  bridge-flow: true
  security-flow: false
  protection-flow: true
  ip-ban-flow: true
  profile-flow: true
  movement-audit: false
  teleport-audit: false
  command-flow: true

premium:
  enabled: true
  api-timeout-ms: 3000
  # If true, ProudAuth rewrites the GameProfile on the proxy with the premium UUID.
  # On some offline-mode networks, this can cause unusual backend behavior.
  # Safe default: false. The backend still receives the premium result via bridge.
  rewrite-game-profile: false

bridge:
  enabled: false
  mode: FALLBACK
  transport: MYSQL
  shared-secret: "change-me"
  assertion-ttl-seconds: 10
