language: "it"

database:
  host: "localhost"
  port: 3306
  name: "proudauth"
  user: "root"
  password: "password"
  pool-size: 10

debugger:
  enabled: false
  player-resolution: true
  session-flow: true
  premium-flow: true
  bridge-flow: true
  security-flow: false
  protection-flow: true
  ip-ban-flow: true
  profile-flow: true
  movement-audit: false
  teleport-audit: false
  command-flow: true

premium:
  enabled: true
  api-timeout-ms: 3000

bridge:
  enabled: false
  mode: FALLBACK
  transport: MYSQL
  shared-secret: "change-me"
  assertion-ttl-seconds: 10
  backend-check:
    enabled: true
    timeout-ms: 2500
    poll-interval-ms: 100

guards:
  enabled: true
  antibot:
    window-seconds: 12
    max-connections-per-ip: 8
    ban-seconds: 900
  identity:
    window-seconds: 3600
    max-usernames-per-ip: 4
    max-ips-per-username: 5
    ban-seconds: 7200
  history-retention-days: 30

reports:
  auto-export:
    enabled: true
    interval-minutes: 60
    window-hours: 24
    limit: 50
