language: "it"

database:
  host: "localhost"
  port: 3306
  name: "proudauth"
  user: "root"
  password: "password"
  pool-size: 10

debugger:
  enabled: false
  player-resolution: true
  session-flow: true
  premium-flow: true
  bridge-flow: true
  security-flow: false
  protection-flow: true
  ip-ban-flow: true
  profile-flow: true
  movement-audit: false
  teleport-audit: false
  command-flow: true

premium:
  enabled: true
  api-timeout-ms: 3000
  # Premium nickname policy:
  # - STRICT_GLOBAL (default): if Mojang says the nickname is premium, Velocity always forces
  #   premium authentication and cracked clients using that nickname are denied.
  # - CLAIM_ON_FIRST_JOIN: on the first join of an unclaimed nickname, the player must choose
  #   /sp or /premium. That first completed claim becomes the permanent local rule for the nickname.
  mode: STRICT_GLOBAL
  claim-pending-seconds: 300
  online-mode-denied-message: "<dark_gray>[</dark_gray><aqua>ProudMC</aqua><dark_gray>] </dark_gray><red>Accesso rifiutato</red><newline><gray>Questo nickname premium richiede un account Minecraft premium autenticato.</gray>"
  claim-failed-denied-message: "<dark_gray>[</dark_gray><aqua>ProudMC</aqua><dark_gray>] </dark_gray><red>Verifica premium fallita</red><newline><gray>Non e stato possibile confermare questo nickname come premium.</gray><newline><yellow>Rientra e scegli di nuovo <white>/sp</white><yellow> oppure <white>/premium</white><yellow>.</yellow>"

bridge:
  enabled: false
  mode: FALLBACK
  transport: MYSQL
  shared-secret: "change-me"
  assertion-ttl-seconds: 10
  backend-check:
    enabled: true
    timeout-ms: 2500
    poll-interval-ms: 100

guards:
  enabled: true
  antibot:
    window-seconds: 12
    max-connections-per-ip: 8
    ban-seconds: 900
  identity:
    window-seconds: 3600
    max-usernames-per-ip: 4
    max-ips-per-username: 5
    ban-seconds: 7200
  history-retention-days: 30

reports:
  auto-export:
    enabled: true
    interval-minutes: 60
    window-hours: 24
    limit: 50
